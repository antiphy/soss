<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SOSS 管理后台{% endblock %}</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/admin/buckets">SOSS 管理后台</a>
  <nav class="nav">
    <a href="/admin/buckets">存储桶</a>
    {% if read_only %}<span class="badge badge-warn" title="存储损坏或服务被置为只读">只读模式</span>{% endif %}
  </nav>
  <div class="user">
    <span>{{ user }}</span>
    <a class="link" href="/admin/logout">退出</a>
  </div>
</header>
<main class="container">
  {% if flash %}<div class="flash {% if flash_kind %}{{ flash_kind }}{% else %}info{% endif %}">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
<footer class="footer">soss {{ version }}</footer>
{# admin.js 读 window.SOSS_ADMIN 决定初始化哪个页面，必须先由各页面脚本赋值。 #}
{% block scripts %}{% endblock %}
<script src="/static/admin.js"></script>
</body>
</html>
